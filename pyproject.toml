[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mech-scal"
version = "0.1.0"
description = "Output-aware replication and experimental indexing prototype for scalable storage in UTXO blockchains."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "jdom1824" }
]
keywords = ["bitcoin", "blockchain", "utxo", "regtest", "research-software", "replication"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<3.9"]
dev = ["pytest>=8,<9", "ruff>=0.6,<0.7", "build>=1.2,<2", "pre-commit>=3.8,<4"]

[project.scripts]
mech-scal = "mech_scal.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["baseline*", "benchmark*", "mech_scal*", "resilience*", "workload*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
